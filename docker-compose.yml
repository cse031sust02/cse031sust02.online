services:
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://cse031sust02.online}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: cse031sust02-web
    ports:
      - "80:3000"   # host port 80 → app port 3000 inside the container
    env_file:
      - path: web/.env
        required: false
    environment:
      PORT: "3000"
    restart: unless-stopped
