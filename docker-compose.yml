# Local development with live reload: `docker compose up` → http://localhost:3000
# Edits under web/ (code, styles, content/profile.yaml) show up without a rebuild.
# The production image is built from web/Dockerfile (see CI), not from this file.
name: cse031sust02-dev

services:
  web:
    image: node:22-alpine
    working_dir: /app
    # Install Linux deps only when package-lock.json changed, then run the dev server.
    command: >-
      sh -c "apk add --no-cache libc6-compat >/dev/null &&
      if ! cmp -s package-lock.json node_modules/.lock-snapshot; then
      npm ci && cp package-lock.json node_modules/.lock-snapshot; fi &&
      npm run dev -- --hostname 0.0.0.0"
    ports:
      - "${DEV_PORT:-3000}:3000"   # set DEV_PORT if 3000 is taken
    volumes:
      - ./web:/app
      # Container-only folders: macOS node_modules / build output must not leak in (or out).
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
      # Next.js reads web/.env and web/.env.local itself (they're in the mounted folder).

volumes:
  node_modules:
  next_cache:
