# Nginx reverse proxy for the Next.js standalone server (Docker or PM2) on 127.0.0.1:3000.
# Install: copy to /etc/nginx/sites-available/, symlink into sites-enabled/, run `nginx -t`.
# Certificates: `certbot --nginx -d cse031sust02.dev -d www.cse031sust02.dev` (Let's Encrypt).

upstream cse031sust02_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP → HTTPS (certbot's HTTP-01 challenge still works through this block).
server {
    listen 80;
    listen [::]:80;
    server_name cse031sust02.dev www.cse031sust02.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://cse031sust02.dev$request_uri;
    }
}

# www → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.cse031sust02.dev;

    ssl_certificate     /etc/letsencrypt/live/cse031sust02.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cse031sust02.dev/privkey.pem;

    return 301 https://cse031sust02.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cse031sust02.dev;

    ssl_certificate     /etc/letsencrypt/live/cse031sust02.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cse031sust02.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # HSTS belongs here (TLS terminator); the app sets the other security headers
    # (and X-Accel-Buffering: no on /api/chat).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 64k;   # chat + contact bodies are small
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Shared proxy settings. X-Forwarded-For is REPLACED with the real client IP (not appended),
    # so the app's rate limiter (first hop) can't be spoofed by a client-sent header.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Digital Twin: streamed tokens must not be buffered.
    location = /api/chat {
        proxy_pass http://cse031sust02_web;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # Long-cached build assets.
    location /_next/static/ {
        proxy_pass http://cse031sust02_web;
        expires 1y;
        # add_header in a location replaces server-level ones, so repeat HSTS.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        proxy_pass http://cse031sust02_web;
        proxy_read_timeout 60s;
    }
}
